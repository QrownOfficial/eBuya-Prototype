<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>eBuya — Spend with certainty.</title>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           ROOT VARIABLES
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        :root {
            --orange: #F9631C;
            --navy: #123456;
            --gold: #F4C430;
            --cream: #FAF8F5;
            --white: #FFFFFF;
            --text: #17212B;
            --muted: #66717D;
            --line: rgba(18, 52, 86, 0.12);
            --navy-soft: rgba(18, 52, 86, 0.07);
            --orange-soft: rgba(249, 99, 28, 0.10);
            --shadow: 0 14px 40px rgba(18, 52, 86, 0.065);
            --shadow-hover: 0 20px 48px rgba(18, 52, 86, 0.11);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
            color: var(--text);
            background: var(--cream);
            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        img {
            display: block;
            max-width: 100%;
        }

        #app {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .background::before {
            content: "";
            position: absolute;
            width: 580px;
            height: 580px;
            top: -290px;
            right: -170px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 196, 48, 0.25) 0%, rgba(244, 196, 48, 0) 70%);
        }

        .background::after {
            content: "";
            position: absolute;
            width: 680px;
            height: 680px;
            bottom: -400px;
            left: -300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(249, 99, 28, 0.16) 0%, rgba(249, 99, 28, 0) 70%);
        }

        .background-grid {
            position: absolute;
            inset: 0;
            opacity: 0.48;
            background-image:
                linear-gradient(rgba(18, 52, 86, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 52, 86, 0.035) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            width: 100%;
            padding: 16px 34px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .logo {
            display: inline-flex;
            align-items: baseline;
            font-size: 30px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1.8px;
            text-decoration: none;
        }

        .logo-e {
            color: #F9631C;
        }
        .logo-bu {
            color: #123456;
        }
        .logo-ya {
            color: #F4C430;
        }

        .hamburger {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 24px;
            color: var(--navy);
            cursor: pointer;
            padding: 8px;
            line-height: 1;
        }

        .hamburger:hover {
            background: var(--navy-soft);
            border-radius: 8px;
        }

        .hamburger-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(18, 52, 86, 0.15);
            border: 1px solid var(--line);
            padding: 8px 0;
            min-width: 200px;
            z-index: 100;
            display: none;
        }

        .hamburger-menu.open {
            display: block;
        }

        .hamburger-menu button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: none;
            border: none;
            text-align: left;
            font-size: 14px;
            color: var(--navy);
            cursor: pointer;
        }

        .hamburger-menu button:hover {
            background: var(--navy-soft);
        }

        .screen {
            flex: 1;
            padding: 20px 22px 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-content {
            width: min(900px, 100%);
            margin: 0 auto;
            text-align: center;
        }

        .brand-mark {
            width: 74px;
            height: 7px;
            margin: 0 auto 28px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--orange) 0 33%, var(--navy) 33% 66%, var(--gold) 66% 100%);
        }

        .eyebrow {
            margin-bottom: 13px;
            color: var(--orange);
            font-size: 11px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: 1.7px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 820px;
            margin: 0 auto 20px;
            color: var(--navy);
            font-size: clamp(44px, 7vw, 78px);
            line-height: 0.97;
            letter-spacing: -4px;
        }

        h2 {
            color: var(--navy);
            font-size: 22px;
            line-height: 1.2;
        }

        h3 {
            color: var(--navy);
            font-size: 18px;
        }

        .description {
            max-width: 630px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .microcopy {
            max-width: 580px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .text-muted {
            color: var(--muted);
        }

        .text-center {
            text-align: center;
        }

        .entry-grid {
            width: min(780px, 100%);
            margin: 47px auto 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .entry-card {
            min-height: 148px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.87);
            box-shadow: var(--shadow);
            text-align: left;
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
            border: none;
            font-family: inherit;
            font-size: inherit;
            width: 100%;
            color: inherit;
        }

        .entry-card:hover {
            transform: translateY(-3px);
            border-color: rgba(249, 99, 28, 0.30);
            box-shadow: var(--shadow-hover);
        }

        .entry-icon {
            width: 42px;
            height: 42px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: var(--navy-soft);
            color: var(--navy);
            font-size: 18px;
            font-weight: 800;
        }

        .entry-card:nth-child(2) .entry-icon {
            background: var(--orange-soft);
            color: var(--orange);
        }
        .entry-card:nth-child(3) .entry-icon {
            background: var(--gold-soft);
            color: var(--navy);
        }
        .entry-card:nth-child(4) .entry-icon {
            background: var(--navy-soft);
            color: var(--navy);
        }

        .entry-card h2 {
            margin-bottom: 7px;
            font-size: 19px;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        .entry-card p {
            margin-bottom: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .home-note {
            margin-top: 34px;
            color: var(--navy);
            font-size: 12px;
            font-weight: 700;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 38px;
            margin-bottom: 30px;
            padding: 0 15px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--navy);
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
        }

        .back-button:hover {
            background: var(--navy-soft);
        }

        .btn-primary {
            min-height: 50px;
            padding: 0 25px;
            border: 0;
            border-radius: 999px;
            background: var(--navy);
            color: var(--white);
            font-weight: 750;
            box-shadow: 0 10px 25px rgba(18, 52, 86, 0.16);
            cursor: pointer;
            transition: transform 150ms ease, box-shadow 150ms ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 32px rgba(18, 52, 86, 0.22);
        }

        .btn-primary.orange {
            background: var(--orange);
            box-shadow: 0 10px 25px rgba(249, 99, 28, 0.2);
        }

        .btn-primary.orange:hover {
            background: #e0550f;
        }

        .btn-secondary {
            min-height: 50px;
            padding: 0 25px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            color: var(--navy);
            font-weight: 750;
            cursor: pointer;
            transition: transform 150ms ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
        }

        .button-row {
            margin-top: 27px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 11px;
            flex-wrap: wrap;
        }

        .button-row .btn-primary,
        .button-row .btn-secondary {
            min-width: 120px;
        }

        .input-card {
            width: min(720px, 100%);
            margin: 32px auto 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--white);
            box-shadow: 0 14px 40px rgba(18, 52, 86, 0.07);
            padding: 4px 6px 4px 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: border-color 0.2s ease;
        }

        .input-card:focus-within {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px var(--orange-soft);
        }

        .input-card input {
            flex: 1;
            min-height: 56px;
            padding: 12px 4px 12px 0;
            border: 0;
            outline: 0;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            color: var(--text);
            line-height: 1.5;
            width: 100%;
        }

        .input-card input::placeholder {
            color: #9AA3AB;
        }

        .input-card .mic-button {
            flex-shrink: 0;
            font-size: 22px;
            color: var(--muted);
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px 12px;
            border-radius: 50%;
            transition: all 0.2s ease;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
        }

        .input-card .mic-button:hover {
            color: var(--orange);
            background: var(--orange-soft);
        }

        .input-card .mic-button.listening {
            color: var(--orange);
            background: var(--orange-soft);
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }

        .input-card.dashed {
            padding: 30px;
            text-align: center;
            border-style: dashed;
            border-radius: 18px;
        }

        .input-card .icon-large {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .input-card .label {
            color: var(--muted);
            margin-bottom: 12px;
        }

        .info-card {
            width: min(820px, 100%);
            margin: 28px auto 0;
            padding: 27px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 20px 60px rgba(18, 52, 86, 0.08);
            text-align: left;
        }

        .info-card .summary-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--navy);
        }

        .info-card p {
            color: var(--muted);
            line-height: 1.7;
        }

        .chip-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 820px;
            margin: 20px auto 0;
        }

        .chip {
            padding: 10px 20px;
            border: 1.5px solid var(--line);
            border-radius: 40px;
            background: var(--white);
            color: var(--navy);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            font-family: inherit;
        }

        .chip:hover {
            border-color: rgba(249, 99, 28, 0.3);
        }

        .chip.active {
            border-color: var(--orange);
            background: var(--orange-soft);
            color: var(--orange);
            box-shadow: 0 0 0 3px rgba(249, 99, 28, 0.08);
        }

        .chip-count {
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
        }

        .product-grid {
            width: 100%;
            margin: 35px auto 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .product-card {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            box-shadow: var(--shadow);
            transition: transform 160ms ease, box-shadow 160ms ease;
            text-align: left;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .product-card.featured {
            border-color: var(--orange);
            box-shadow: 0 0 0 2px var(--orange), var(--shadow);
        }

        .product-card.featured:hover {
            box-shadow: 0 0 0 2px var(--orange), var(--shadow-hover);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1.18 / 1;
            overflow: hidden;
            background: #F1EEE9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #aaa;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            display: inline-block;
            margin: 12px 20px 4px;
            padding: 3px 12px;
            border-radius: 999px;
            background: var(--orange-soft);
            color: var(--orange);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-badge.gold {
            background: var(--gold-soft);
            color: var(--navy);
        }

        .product-badge.navy {
            background: var(--navy-soft);
            color: var(--navy);
        }

        .product-info {
            padding: 4px 20px 20px;
        }

        .product-info h3 {
            font-size: 18px;
            color: var(--navy);
            margin-bottom: 4px;
        }

        .product-info .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
        }

        .product-info .price small {
            font-weight: 400;
            color: var(--muted);
            font-size: 13px;
        }

        .product-info .specs {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .product-info .rating {
            margin-top: 6px;
            color: var(--gold);
            font-size: 13px;
            font-weight: 600;
        }

        .product-info .rating span {
            color: var(--muted);
            font-weight: 400;
        }

        .product-info .strengths {
            margin-top: 8px;
            font-size: 13px;
            color: var(--navy);
        }

        .product-info .strengths strong {
            color: var(--orange);
        }

        .product-info .tradeoffs {
            margin-top: 4px;
            font-size: 13px;
            color: var(--muted);
        }

        .product-info .tradeoffs strong {
            color: #b91c1c;
        }

        .product-card .click-hint {
            display: block;
            margin-top: 12px;
            padding: 8px 16px;
            background: var(--orange-soft);
            color: var(--orange);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .tradeoff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .tradeoff-card {
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            text-align: left;
            box-shadow: var(--shadow);
        }

        .tradeoff-card h3 {
            font-size: 16px;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .tradeoff-card .strength-list {
            color: var(--navy);
            font-size: 13px;
            line-height: 1.6;
        }

        .tradeoff-card .strength-list .check {
            color: var(--orange);
        }

        .tradeoff-card .tradeoff-list {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            margin-top: 8px;
        }

        .tradeoff-card .tradeoff-list .cross {
            color: #b91c1c;
        }

        .tradeoff-card .divider {
            border: none;
            border-top: 1px solid var(--line);
            margin: 12px 0;
        }

        .seller-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .seller-card {
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            text-align: left;
            box-shadow: var(--shadow);
            transition: transform 160ms ease, border-color 160ms ease;
            cursor: pointer;
        }

        .seller-card:hover {
            transform: translateY(-3px);
            border-color: var(--orange);
        }

        .seller-card .seller-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
        }

        .seller-card .seller-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--navy);
            margin: 4px 0;
        }

        .seller-card .seller-rating {
            color: var(--gold);
            font-weight: 600;
            font-size: 14px;
        }

        .seller-card .seller-rating span {
            color: var(--muted);
            font-weight: 400;
        }

        .seller-card .seller-reputation {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 40px;
            background: var(--navy-soft);
            color: var(--navy);
            font-size: 12px;
            font-weight: 600;
            margin: 4px 0;
        }

        .seller-card .seller-reputation.excellent {
            background: rgba(249, 99, 28, 0.08);
            color: var(--orange);
        }

        .seller-card .seller-detail {
            font-size: 13px;
            color: var(--muted);
            margin: 2px 0;
        }

        .seller-card .seller-detail strong {
            color: var(--navy);
        }

        .seller-card .btn-primary {
            width: 100%;
            margin-top: 12px;
            justify-content: center;
        }

        .seller-card .click-hint {
            display: block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--navy-soft);
            color: var(--navy);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
        }

        .location-box {
            background: rgba(18, 52, 86, 0.02);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px dashed rgba(18, 52, 86, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .location-box .location-label {
            font-size: 15px;
            color: var(--navy);
            font-weight: 500;
        }

        .location-box .location-value {
            font-size: 15px;
            color: var(--orange);
            font-weight: 700;
        }

        .final-card {
            max-width: 720px;
            margin: 30px auto 0;
            padding: 30px;
            border: 2px solid var(--orange);
            border-radius: 24px;
            background: var(--white);
            box-shadow: 0 20px 60px rgba(18, 52, 86, 0.08);
            text-align: left;
        }

        .final-card .pick-label {
            color: var(--orange);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .final-card .pick-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--navy);
            margin: 4px 0;
        }

        .final-card .pick-reason {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0 16px;
        }

        .final-card .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            margin: 16px 0;
        }

        .final-card .detail-item {
            font-size: 14px;
        }

        .final-card .detail-item strong {
            color: var(--navy);
        }

        .final-card .detail-item .value {
            color: var(--text);
        }

        .final-card .btn-primary {
            width: 100%;
            justify-content: center;
            margin-top: 16px;
        }

        .fork-grid {

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PRIORITIES DATA
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        var PRIORITIES_ALL = [

            'Storage', 'Display', 'Build quality', 'Reviews', 'Brand',
            'Warranty', 'Seller reputation', 'Delivery', 'Return policy',

        ];

        var PRIORITIES_BUY = [
            'Price', 'Seller reputation', 'Delivery speed', 'Delivery cost',
            'Warranty', 'Return policy', 'Availability', 'Authenticity',

        ];

        var USE_CASES = [

        ];

        var BUDGET_OPTIONS = [

        //  VOICE INPUT FUNCTION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        var recognition = null;
        var isListening = false;

        function startVoiceInput(inputId, buttonId) {
            var input = document.getElementById(inputId);
            var button = document.getElementById(buttonId);

            if (!input) {
                console.warn('Input field not found:', inputId);
                return;
            }

            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Voice input is not supported in this browser. Please try Chrome or Edge.');
                return;
            }

            if (isListening && recognition) {
                recognition.stop();
                isListening = false;
                if (button) button.classList.remove('listening');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isListening = true;
                if (button) button.classList.add('listening');
                input.placeholder = '🎤 Listening... Speak now';
            };

            recognition.onresult = function(event) {
                var transcript = '';
                for (var i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        transcript += event.results[i][0].transcript;
                    } else {
                        var interim = '';
                        for (var j = event.resultIndex; j < event.results.length; j++) {
                            interim += event.results[j][0].transcript;
                        }
                        input.value = interim;
                    }
                }
                if (transcript) {
                    input.value = transcript;
                }
            };

            recognition.onerror = function(event) {
                console.warn('Speech recognition error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Please allow microphone access to use voice input.');
                } else if (event.error === 'no-speech') {
                    alert('No speech detected. Please try again.');
                } else {
                    alert('Voice input error: ' + event.error + '. Please try again.');
                }
                stopVoiceInput(inputId, buttonId);
            };

            recognition.onend = function() {
                stopVoiceInput(inputId, buttonId);
            };

            recognition.start();
        }

        function stopVoiceInput(inputId, buttonId) {
            isListening = false;
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
                recognition = null;
            }
            var button = document.getElementById(buttonId);
            if (button) {
                button.classList.remove('listening');
            }
            var input = document.getElementById(inputId);
            if (input) {
                input.placeholder = 'Type or speak...';
                if (!input.value.trim()) {
                    input.value = '';
                }
            }

            else if (s === 'knowSummary') renderKnowSummary();
            else if (s === 'knowAlternatives') renderKnowAlternatives();
            else if (s === 'knowProductDetail') renderKnowProductDetail();
            else if (s === 'stillConsidering') renderStillConsidering();
            else if (s === 'consideringUseCase') renderConsideringUseCase();
            else if (s === 'consideringPriorities') renderConsideringPriorities();
            else if (s === 'consideringBudget') renderConsideringBudget();
            else if (s === 'consideringSummary') renderConsideringSummary();
            else if (s === 'consideringRecommendation') renderConsideringRecommendation();
            else if (s === 'consideringTradeoffs') renderConsideringTradeoffs();
            else if (s === 'consideringAlternatives') renderConsideringAlternatives();
            else if (s === 'consideringProductDetail') renderConsideringProductDetail();
            else screen.innerHTML = '<div class="screen-content"><p>Something went wrong.</p></div>';
        }

        window.goTo = function(page) {
            if (state.currentStage !== page) {
                state.history.push(state.currentStage);
            }
            state.currentStage = page;
            render();
        };

        function goBack() {
            if (state.history.length > 0) {
                var prev = state.history.pop();
                state.currentStage = prev;
                render();
            } else {
                state.currentStage = 'home';
                render();
            }
        }

        function resetApp() {
            document.getElementById('hamburgerMenu').classList.remove('open');
            state.currentStage = 'home';
            state.entryMethod = null;
            state.userQuestion = '';
            state.uploadedImage = null;
            state.pastedUrl = '';
            state.scannedCode = '';
            state.selectedPriorities = [];
            state.useCase = [];
            state.budget = null;
            state.budgetMin = null;
            state.budgetMax = null;
            state.customUseCase = '';
            state.location = null;
            state.selectedSeller = null;
            state.productConfirmed = false;
            state.decisionFork = null;
            state.identifiedProduct = null;
            state.returnToStage = null;
            state.selectedProductId = null;
            state.history = [];
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
                recognition = null;
                isListening = false;
            }
            render();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  1. HOME
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderHome() {
            screen.innerHTML = `
                <div class="screen-content">
                    <div class="brand-mark"></div>
                    <div class="eyebrow">Spend with certainty.</div>
                    <h1>What are you considering?</h1>
                    <p class="description">Tell us what you're looking for and we'll help you figure out what matters.</p>

                    <div class="entry-grid">
                        <button class="entry-card" type="button" onclick="state.entryMethod='question'; window.goTo('ask')">
                            <div class="entry-icon">?</div>
                            <h2>Ask a Question</h2>
                            <p>Tell us what you're looking for and we'll help you work out what matters.</p>
                        </button>
                        <button class="entry-card" type="button" onclick="state.entryMethod='image'; window.goTo('uploadImage')">
                            <div class="entry-icon">↑</div>
                            <h2>Upload an Image</h2>
                            <p>Show us the product you're considering.</p>
                        </button>
                        <button class="entry-card" type="button" onclick="state.entryMethod='url'; window.goTo('pasteUrl')">
                            <div class="entry-icon">↗</div>
                            <h2>Paste a URL</h2>
                            <p>Share a product link and we'll take a closer look.</p>
                        </button>
                        <button class="entry-card" type="button" onclick="state.entryMethod='code'; window.goTo('scanCode')">
                            <div class="entry-icon">⌁</div>
                            <h2>Scan a Code</h2>
                            <p>Scan a product code and we'll identify what you're looking at.</p>
                        </button>
                    </div>

                    <div class="home-note">Spend with certainty.</div>
                </div>
            `;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  2. ASK A QUESTION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderAsk() {
            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">What are you considering?</h1>
                    <p class="microcopy">Tell us what you're looking for in your own words and we'll take it from there.</p>

                    <div class="input-card">
                        <input type="text" id="questionInput" placeholder="Type or speak your question..." value="${state.userQuestion}">
                        <button class="mic-button" id="askMicBtn" onclick="startVoiceInput('questionInput', 'askMicBtn')">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>

                    <div class="button-row">
                        <button class="btn-primary" onclick="submitQuestion()">Continue</button>
                    </div>
                </div>
            `;
        }

        function submitQuestion() {
            var input = document.getElementById('questionInput');
            if (input.value.trim().length < 3) {
                input.style.border = '2px solid var(--orange)';
                input.focus();
                return;
            }
            state.userQuestion = input.value.trim();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
                recognition = null;
                isListening = false;
            }
            window.goTo('understandingRequest');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  3. UNDERSTANDING THE REQUEST — FIXED "Something else" input
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderUnderstandingRequest() {
            var showSomethingElse = state.useCase.indexOf('Something else') !== -1;

            var chips = USE_CASES.map(function(c) {
                var active = state.useCase.indexOf(c) !== -1 ? 'active' : '';
                return `<button class="chip ${active}" onclick="toggleUseCase('${c}')">${c}</button>`;
            }).join('');

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">Let's narrow it down.</h1>
                    <p class="microcopy">A little more context will help us focus on the options that actually make sense for you.</p>
                    <p style="color:var(--navy);font-weight:600;margin-top:12px;">What do you need it for?</p>

                    <div class="chip-grid">${chips}</div>
                    <p class="chip-count">Selected: ${state.useCase.length || 'none'}</p>

                    ${showSomethingElse ? `

                            <label style="font-size:13px;color:var(--navy);font-weight:600;display:block;text-align:left;margin-bottom:6px;">Tell us what you need it for:</label>
                            <div class="input-card" style="border-radius:999px;padding:4px 6px 4px 20px;display:flex;align-items:center;gap:4px;transition:border-color 0.2s ease;width:100%;margin:0;">
                                <input type="text" id="customUseCase" placeholder="Type or speak..." value="${state.customUseCase || ''}" style="flex:1;min-height:48px;padding:10px 4px 10px 0;border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;color:var(--text);line-height:1.5;width:100%;">
                                <button class="mic-button" id="useCaseMicBtn" onclick="startVoiceInput('customUseCase', 'useCaseMicBtn')" style="flex-shrink:0;font-size:20px;color:var(--muted);cursor:pointer;background:none;border:none;padding:8px 10px;border-radius:50%;transition:all 0.2s ease;line-height:1;display:flex;align-items:center;justify-content:center;width:44px;height:44px;">
                                    <i class="fas fa-microphone"></i>
                                </button>
                            </div>
                            <div style="font-size:12px;color:var(--muted);margin-top:8px;">This helps us recommend the right options for your specific needs.</div>
                        </div>
                    ` : ''}

                    <div class="button-row">
                        <button class="btn-primary" onclick="submitUseCase()">Continue</button>
                    </div>
                </div>
            `;

            if (showSomethingElse) {
                var input = document.getElementById('customUseCase');
                if (input) input.focus();
            }
        }

        function toggleUseCase(uc) {
            var index = state.useCase.indexOf(uc);
            if (index === -1) {
                state.useCase.push(uc);
            } else {
                state.useCase.splice(index, 1);
                if (uc === 'Something else') {
                    state.customUseCase = '';
                }
            }
            render();
        }

        function submitUseCase() {
            if (state.useCase.length === 0) {
                alert('Please select at least one use case.');
                return;
            }

            if (state.useCase.indexOf('Something else') !== -1) {
                var input = document.getElementById('customUseCase');
                if (input && input.value.trim().length > 0) {
                    state.customUseCase = input.value.trim();
                    var index = state.useCase.indexOf('Something else');
                    if (index !== -1) {
                        state.useCase[index] = state.customUseCase;
                    }
                } else {
                    alert('Please tell us what you need it for.');
                    return;
                }
            }

            window.goTo('priorities');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  4. WHAT MATTERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderPriorities() {
            var chips = PRIORITIES_ALL.map(function(p) {
                var active = state.selectedPriorities.indexOf(p) !== -1 ? 'active' : '';
                return `<button class="chip ${active}" onclick="togglePriority('${p}')">${p}</button>`;
            }).join('');

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">What matters to you?</h1>
                    <p class="microcopy">Pick the things you'd want us to weigh most when helping you decide.</p>

                    <div class="chip-grid">${chips}</div>
                    <p class="chip-count">Selected: ${state.selectedPriorities.length || 'none'}</p>

                    <div class="button-row">
                        <button class="btn-primary" onclick="submitPriorities()">Continue</button>
                    </div>
                </div>
            `;
        }

        function togglePriority(p) {
            var index = state.selectedPriorities.indexOf(p);
            if (index === -1) {
                state.selectedPriorities.push(p);
            } else {
                state.selectedPriorities.splice(index, 1);
            }
            render();
        }

        function submitPriorities() {
            if (state.selectedPriorities.length === 0) {
                alert('Please select at least one priority.');
                return;
            }
            window.goTo('budget');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  5. BUDGET
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderBudget() {
            var selected = state.budget;
            var showSpecificRange = (selected === 'Set a specific range');

            var options = BUDGET_OPTIONS.map(function(b, index) {
                var active = (selected === b) ? 'active' : '';
                return `<button class="chip ${active}" onclick="setBudgetByIndex(${index})">${b}</button>`;
            }).join('');

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">What's your budget?</h1>
                    <p class="microcopy">Tell us what you're comfortable spending, or choose that you don't have a fixed budget and we'll keep the decision focused on fit and value.</p>

                    <div class="chip-grid">${options}</div>

                    ${showSpecificRange ? `
                        <div class="controversial-expand">
                            <div class="range-grid">
                                <div>
                                    <label>Minimum (₦)</label>
                                    <input type="number" id="budgetMin" placeholder="0">
                                </div>
                                <div>
                                    <label>Maximum (₦)</label>
                                    <input type="number" id="budgetMax" placeholder="0">
                                </div>
                            </div>
                            <div class="hint">Enter your preferred price range in Naira.</div>
                        </div>
                    ` : ''}

                    <div class="button-row">
                        <button class="btn-primary" onclick="submitBudget()">Continue</button>
                    </div>
                </div>
            `;

            if (showSpecificRange) {
                var minInput = document.getElementById('budgetMin');
                var maxInput = document.getElementById('budgetMax');
                if (minInput) minInput.value = state.budgetMin || '';
                if (maxInput) maxInput.value = state.budgetMax || '';
                if (minInput) minInput.focus();
            }
        }

        function setBudgetByIndex(index) {
            var b = BUDGET_OPTIONS[index];
            state.budget = b;
            if (b !== 'Set a specific range') {
                state.budgetMin = null;
                state.budgetMax = null;
            }
            render();
        }

        function submitBudget() {
            if (!state.budget) {
                alert('Please select a budget option.');
                return;
            }

            if (state.budget === 'Set a specific range') {
                var minInput = document.getElementById('budgetMin');
                var maxInput = document.getElementById('budgetMax');
                if (minInput && maxInput) {
                    var min = parseInt(minInput.value);
                    var max = parseInt(maxInput.value);
                    if (isNaN(min) || isNaN(max)) {
                        alert('Please enter both a minimum and maximum amount.');
                        return;
                    }
                    if (min > max) {
                        alert('Minimum cannot be greater than maximum.');
                        return;
                    }
                    state.budgetMin = min;
                    state.budgetMax = max;
                    state.budget = '₦' + min.toLocaleString() + ' to ₦' + max.toLocaleString();
                }
            }

            window.goTo('understandingSummary');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderUnderstandingSummary() {
            var prioritiesText = state.selectedPriorities.length > 0 ? state.selectedPriorities.join(', ') : 'Not specified';
            var useCaseText = state.useCase.length > 0 ? state.useCase.join(', ') : 'Not specified';
            var budgetText = state.budget || 'Not specified';

            if (budgetText === "I don't have a budget") {
                budgetText = "No fixed budget, we'll focus on finding the strongest fit and value for you.";
            }

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">Here's what we understand.</h1>
                    <p class="microcopy">We've pulled together what you've told us so far so you can make sure we're looking at the decision the same way you are.</p>

                    <div class="info-card">
                        <p><strong style="color:var(--navy);">You're looking for</strong><br>A laptop</p>
                        <p style="margin-top:12px;"><strong style="color:var(--navy);">You'll use it for</strong><br>${useCaseText}</p>
                        <p style="margin-top:12px;"><strong style="color:var(--navy);">What matters most</strong><br>${prioritiesText}</p>

                    <p class="text-muted mt-16">Does that sound right?</p>

                    <div class="button-row">
                        <button class="btn-secondary" onclick="window.goTo('budget')">Go back and change something</button>
                        <button class="btn-primary orange" onclick="window.goTo('recommendation')">Yes, continue</button>
                    </div>
                </div>
            `;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderRecommendation() {
            var p = PRODUCTS.macbook;

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">Here's what we'd recommend.</h1>
                    <p class="microcopy">We looked at what you need, what matters to you and what you're comfortable spending before narrowing this down.</p>

                    <div class="product-grid" style="max-width:480px;margin-left:auto;margin-right:auto;display:flex;justify-content:center;">
                        <div class="product-card featured" style="width:100%;max-width:400px;">
                            <div class="product-image">
                                <img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${p.emoji}'">
                            </div>
                            <div class="product-badge">Our top pick</div>
                            <div class="product-info">
                                <h3>${p.name}</h3>
                                <div class="price">${p.price}</div>
                                <div class="rating">★ ${p.rating} <span>(${p.reviews} reviews)</span></div>
                                <div class="strengths"><strong>✓</strong> ${p.strengths.slice(0,2).join(' • ')}</div>
                                <div class="tradeoffs"><strong>✗</strong> ${p.tradeoffs.slice(0,1).join(' • ')}</div>
                                <p style="margin-top:12px;font-size:14px;color:var(--navy);font-weight:500;">Why we chose it</p>
                                <p style="font-size:13px;color:var(--muted);">It gives you a strong balance of performance, battery life and portability for demanding work and everyday use.</p>
                            </div>
                        </div>
                    </div>

                    <div class="button-row">
                        <button class="btn-primary orange" onclick="window.goTo('tradeoffs')">See trade-offs →</button>
                    </div>
                </div>
            `;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderTradeoffs() {
            var p = PRODUCTS.macbook;

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">Before you decide</h1>

                    <div class="tradeoff-grid">
                        <div class="tradeoff-card" style="border-color:var(--orange);">
                            <h3>What you'll like</h3>
                            <div class="strength-list">
                                ${p.strengths.map(function(s) { return '<div><span class="check">✓</span> ' + s + '</div>'; }).join('')}
                            </div>
                        </div>
                        <div class="tradeoff-card" style="border-color:#b91c1c;">
                            <h3>What to consider</h3>
                            <div class="tradeoff-list">
                                ${p.tradeoffs.map(function(t) { return '<div><span class="cross">✗</span> ' + t + '</div>'; }).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="button-row">
                        <button class="btn-secondary" onclick="window.goTo('alternatives')">See alternatives</button>
                        <button class="btn-primary orange" onclick="startPurchaseFlow()">Make a purchase</button>
                    </div>
                </div>
            `;
        }

        function startPurchaseFlow() {
            if (!state.selectedProductId) {
                state.selectedProductId = 'macbook';
            }
            if (state.location) {
                window.goTo('recommendedSeller');
            } else {
                state.returnToStage = 'recommendedSeller';
                window.goTo('location');
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderAlternatives() {
            var allProducts = [PRODUCTS.macbook, PRODUCTS.lenovo, PRODUCTS.hp];

            var cards = allProducts.map(function(p) {
                var isFeatured = p.id === 'macbook';
                var badgeClass = isFeatured ? '' : (p.id === 'lenovo' ? 'gold' : 'navy');
                var badgeText = isFeatured ? 'Our top pick' : (p.id === 'lenovo' ? 'Best value' : 'Versatile');

                var ctaText = isFeatured ? 'Where to buy from' : 'See more details';
                var ctaAction = isFeatured ? `goToProductBestSeller('${p.id}')` : `goToProductDetail('${p.id}', 'alternatives')`;

                return `
                    <div class="product-card ${isFeatured ? 'featured' : ''}">
                        <div class="product-image">
                            <img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${p.emoji}'">
                        </div>
                        <div class="product-badge ${badgeClass}">${badgeText}</div>
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <div class="price">${p.price}</div>
                            <div class="rating">★ ${p.rating} <span>(${p.reviews} reviews)</span></div>
                            <p style="font-size:13px;color:var(--muted);margin-top:8px;"><strong>Why consider it</strong><br>${p.id === 'macbook' ? 'The strongest all-rounder for most users.' : p.id === 'lenovo' ? 'A strong choice if you want a lightweight Windows laptop with a business-focused design and extensive connectivity.' : 'A flexible choice if you value a 2-in-1 design, touch capability and a more versatile way to use your laptop.'}</p>
                            <button class="btn-primary" style="width:100%;margin-top:12px;justify-content:center;" onclick="${ctaAction}">${ctaText}</button>
                        </div>
                    </div>
                `;
            }).join('');

                        <div style="margin-top:16px;text-align:left;max-width:480px;margin-left:auto;margin-right:auto;">
                            <label style="font-size:13px;color:var(--navy);font-weight:600;display:block;text-align:left;margin-bottom:6px;">Tell us what you need it for:</label>
                            <div class="input-card" style="border-radius:999px;padding:4px 6px 4px 20px;display:flex;align-items:center;gap:4px;transition:border-color 0.2s ease;width:100%;margin:0;">
                                <input type="text" id="consideringCustomUseCase" placeholder="Type or speak..." value="${state.customUseCase || ''}" style="flex:1;min-height:48px;padding:10px 4px 10px 0;border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;color:var(--text);line-height:1.5;width:100%;">
                                <button class="mic-button" id="consideringMicBtn" onclick="startVoiceInput('consideringCustomUseCase', 'consideringMicBtn')" style="flex-shrink:0;font-size:20px;color:var(--muted);cursor:pointer;background:none;border:none;padding:8px 10px;border-radius:50%;transition:all 0.2s ease;line-height:1;display:flex;align-items:center;justify-content:center;width:44px;height:44px;">
                                    <i class="fas fa-microphone"></i>
                                </button>
                            </div>
                            <div style="font-size:12px;color:var(--muted);margin-top:8px;">This helps us recommend the right options for your specific needs.</div>
                        </div>
                    ` : ''}

                    <div class="button-row">
                        <button class="btn-primary" onclick="submitConsideringUseCase()">Continue</button>
                    </div>
                </div>
            `;

            if (showSomethingElse) {
                var input = document.getElementById('consideringCustomUseCase');
                if (input) input.focus();
            }
        }

        function submitConsideringUseCase() {
            if (state.useCase.length === 0) {
                alert('Please select at least one use case.');
                return;
            }

            if (state.useCase.indexOf('Something else') !== -1) {
                var input = document.getElementById('consideringCustomUseCase');
                if (input && input.value.trim().length > 0) {
                    state.customUseCase = input.value.trim();
                    var index = state.useCase.indexOf('Something else');
                    if (index !== -1) {
                        state.useCase[index] = state.customUseCase;
                    }
                } else {
                    alert('Please tell us what you need it for.');
                    return;
                }
            }

            window.goTo('consideringPriorities');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  31-36. CONSIDERING PRIORITIES, BUDGET, SUMMARY, ETC.
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderConsideringPriorities() {
            var chips = PRIORITIES_ALL.map(function(p) {
                var active = state.selectedPriorities.indexOf(p) !== -1 ? 'active' : '';
                return `<button class="chip ${active}" onclick="togglePriority('${p}')">${p}</button>`;
            }).join('');

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">What matters to you?</h1>
                    <p class="microcopy">Choose the things you'd care about most if you were comparing this with other options.</p>

                    <div class="chip-grid">${chips}</div>
                    <p class="chip-count">Selected: ${state.selectedPriorities.length || 'none'}</p>

                    <div class="button-row">
                        <button class="btn-primary" onclick="submitConsideringPriorities()">Continue</button>
                    </div>
                </div>
            `;
        }

        function submitConsideringPriorities() {
            if (state.selectedPriorities.length === 0) {
                alert('Please select at least one priority.');
                return;
            }
            window.goTo('consideringBudget');
        }

        function renderConsideringBudget() {
            var selected = state.budget;
            var showSpecificRange = (selected === 'Set a specific range');

            var options = BUDGET_OPTIONS.map(function(b, index) {
                var active = (selected === b) ? 'active' : '';
                return `<button class="chip ${active}" onclick="setBudgetByIndex(${index})">${b}</button>`;
            }).join('');

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">What's your budget?</h1>
                    <p class="microcopy">Tell us what you're comfortable spending, or choose that you don't have a fixed budget and we'll keep the decision focused on fit and value.</p>

                    <div class="chip-grid">${options}</div>

                    ${showSpecificRange ? `
                        <div class="controversial-expand">
                            <div class="range-grid">
                                <div>
                                    <label>Minimum (₦)</label>
                                    <input type="number" id="budgetMin" placeholder="0">
                                </div>
                                <div>
                                    <label>Maximum (₦)</label>
                                    <input type="number" id="budgetMax" placeholder="0">
                                </div>
                            </div>
                            <div class="hint">Enter your preferred price range in Naira.</div>
                        </div>
                    ` : ''}

                    <div class="button-row">
                        <button class="btn-primary" onclick="submitConsideringBudget()">Continue</button>
                    </div>
                </div>
            `;

            if (showSpecificRange) {
                var minInput = document.getElementById('budgetMin');
                var maxInput = document.getElementById('budgetMax');
                if (minInput) minInput.value = state.budgetMin || '';
                if (maxInput) maxInput.value = state.budgetMax || '';
            }
        }

        function submitConsideringBudget() {
            if (!state.budget) {
                alert('Please select a budget option.');
                return;
            }

            if (state.budget === 'Set a specific range') {
                var minInput = document.getElementById('budgetMin');
                var maxInput = document.getElementById('budgetMax');
                if (minInput && maxInput) {
                    var min = parseInt(minInput.value);
                    var max = parseInt(maxInput.value);
                    if (isNaN(min) || isNaN(max)) {
                        alert('Please enter both a minimum and maximum amount.');
                        return;
                    }
                    if (min > max) {
                        alert('Minimum cannot be greater than maximum.');
                        return;
                    }
                    state.budgetMin = min;
                    state.budgetMax = max;
                    state.budget = '₦' + min.toLocaleString() + ' to ₦' + max.toLocaleString();
                }
            }

            window.goTo('consideringSummary');
        }

        function renderConsideringSummary() {
            var prioritiesText = state.selectedPriorities.length > 0 ? state.selectedPriorities.join(', ') : 'Not specified';
            var useCaseText = state.useCase.length > 0 ? state.useCase.join(', ') : 'Not specified';
            var budgetText = state.budget || 'Not specified';

            if (budgetText === "I don't have a budget") {
                budgetText = "No fixed budget, we'll focus on finding the strongest fit and value for you.";
            }

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">Here's what we understand.</h1>
                    <p class="microcopy">We'll use this to work out whether the product you're considering is actually the best fit for you.</p>

                    <div class="info-card">
                        <p style="margin-top:12px;"><strong style="color:var(--navy);">Use case</strong><br>${useCaseText}</p>
                        <p style="margin-top:12px;"><strong style="color:var(--navy);">Priorities</strong><br>${prioritiesText}</p>
                        <p style="margin-top:12px;"><strong style="color:var(--navy);">Budget</strong><br>${budgetText}</p>
                    </div>

                    <div class="button-row">
                        <button class="btn-primary orange" onclick="window.goTo('consideringRecommendation')">Show me what fits →</button>
                    </div>
                </div>
            `;
        }

        function renderConsideringRecommendation() {
            var p = PRODUCTS.macbook;

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">Here's where we'd land.</h1>
                    <p class="microcopy">We've compared the product you're considering with the alternatives against the things you've told us matter most.</p>

                    <div class="product-grid" style="max-width:480px;margin-left:auto;margin-right:auto;display:flex;justify-content:center;">
                        <div class="product-card featured" style="width:100%;max-width:400px;">
                            <div class="product-image"><img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${p.emoji}'"></div>
                            <div class="product-badge">Our top pick</div>
                            <div class="product-info">
                                <h3>${p.name}</h3>
                                <div class="price">${p.price}</div>
                                <div class="rating">★ ${p.rating} <span>(${p.reviews} reviews)</span></div>
                                <p style="margin-top:12px;font-size:14px;color:var(--orange);font-weight:600;">★ It looks like a good fit.</p>
                                <p style="font-size:13px;color:var(--muted);">It comes closest to giving you what you need without asking you to compromise on the things you've told us matter most.</p>
                            </div>
                        </div>
                    </div>

                    <div class="button-row">
                        <button class="btn-primary orange" onclick="window.goTo('consideringTradeoffs')">See trade-offs →</button>
                    </div>
                </div>
            `;
        }

        function renderConsideringTradeoffs() {
            var p = PRODUCTS.macbook;

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">Before you decide</h1>
                    <p class="microcopy">Every option gives you something and asks you to give something up, so here's what we'd want you to know before choosing this one.</p>

                    <div class="tradeoff-grid">
                        <div class="tradeoff-card" style="border-color:var(--orange);">
                            <h3>What you'll like</h3>
                            <div class="strength-list">
                                ${p.strengths.map(function(s) { return '<div><span class="check">✓</span> ' + s + '</div>'; }).join('')}
                            </div>
                        </div>
                        <div class="tradeoff-card" style="border-color:#b91c1c;">
                            <h3>What to consider</h3>
                            <div class="tradeoff-list">
                                ${p.tradeoffs.map(function(t) { return '<div><span class="cross">✗</span> ' + t + '</div>'; }).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="button-row">
                        <button class="btn-secondary" onclick="window.goTo('consideringAlternatives')">See alternatives</button>
                        <button class="btn-primary orange" onclick="startPurchaseFlow()">Make a purchase</button>
                    </div>
                </div>
            `;
        }

        function renderConsideringAlternatives() {
            var allProducts = [PRODUCTS.macbook, PRODUCTS.lenovo, PRODUCTS.hp];

            var cards = allProducts.map(function(p) {
                var isFeatured = p.id === 'macbook';
                var badgeClass = isFeatured ? '' : (p.id === 'lenovo' ? 'gold' : 'navy');
                var badgeText = isFeatured ? 'Our top pick' : (p.id === 'lenovo' ? 'Best value' : 'Versatile');

                var ctaText = isFeatured ? 'Where to buy from' : 'See more details';
                var ctaAction = isFeatured ? `goToProductBestSeller('${p.id}')` : `goToConsideringProductDetail('${p.id}')`;

                return `
                    <div class="product-card ${isFeatured ? 'featured' : ''}">
                        <div class="product-image">
                            <img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${p.emoji}'">
                        </div>
                        <div class="product-badge ${badgeClass}">${badgeText}</div>
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <div class="price">${p.price}</div>
                            <div class="rating">★ ${p.rating} <span>(${p.reviews} reviews)</span></div>
                            <p style="font-size:13px;color:var(--muted);margin-top:8px;"><strong>Why consider it</strong><br>${p.id === 'macbook' ? 'The strongest all-rounder for most users.' : p.id === 'lenovo' ? 'A strong choice if you want a lightweight Windows laptop with a business-focused design and extensive connectivity.' : 'A flexible choice if you value a 2-in-1 design, touch capability and a more versatile way to use your laptop.'}</p>
                            <button class="btn-primary" style="width:100%;margin-top:12px;justify-content:center;" onclick="${ctaAction}">${ctaText}</button>
                        </div>
                    </div>
                `;
            }).join('');

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">What else could work?</h1>
                    <p class="microcopy">These are the alternatives we'd keep on the table if you want to trade one priority for another.</p>

                    <div class="product-grid">${cards}</div>

                    <div class="button-row">
                        <button class="btn-secondary" onclick="window.goTo('consideringTradeoffs')">← Back to trade-offs</button>
                    </div>
                </div>
            `;
        }

        function renderConsideringProductDetail() {
            var productId = state.selectedProductId || 'lenovo';
            var p = PRODUCTS[productId];
            if (!p) p = PRODUCTS.lenovo;

            var strengthsHtml = p.strengths.map(function(s) {
                return '<div><span class="check">✓</span> ' + s + '</div>';
            }).join('');

            var tradeoffsHtml = p.tradeoffs.map(function(t) {
                return '<div><span class="cross">✗</span> ' + t + '</div>';
            }).join('');

            screen.innerHTML = `
                <div class="screen-content">
                    <button class="back-button" onclick="goBack()">← Back</button>
                    <div class="brand-mark"></div>
                    <h1 style="font-size:clamp(32px,5vw,48px);letter-spacing:-2px;">${p.name}</h1>
                    <p class="microcopy">Here's a closer look at what this option offers and what you'd be giving up.</p>

                    <div class="detail-product-card">
                        <div class="product-image">
                            <img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${p.emoji}'">
                        </div>
                        <div class="detail-body">
                            <h3>${p.name}</h3>
                            <div class="price">${p.price}</div>
                            <div class="specs">${p.specs}</div>
                            <div class="rating">★ ${p.rating} <span>(${p.reviews} reviews)</span></div>
                        </div>
                    </div>

                    <div class="tradeoff-grid">
                        <div class="tradeoff-card" style="border-color:var(--orange);">
                            <h3>What you'll like</h3>
                            <div class="strength-list">${strengthsHtml}</div>
                        </div>
                        <div class="tradeoff-card" style="border-color:#b91c1c;">
                            <h3>What to consider</h3>
                            <div class="tradeoff-list">${tradeoffsHtml}</div>
                        </div>
                    </div>

                    <div class="button-row">
                        <button class="btn-secondary" onclick="goBack()">← Back to summary</button>
                        <button class="btn-primary orange" onclick="goToProductBestSeller('${p.id}')">Where to buy from →</button>
                    </div>
                </div>
            `;
        }

        function goToConsideringProductDetail(productId) {
            state.selectedProductId = productId;
            window.goTo('consideringProductDetail');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  START
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        render();
    </script>

</body>
</html>
